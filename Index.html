<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ખોવાયેલો મોબાઇલ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
      color: #222;
    }

    p {
      color: #555;
      line-height: 1.6;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #1769e0;
      color: white;
      font-size: 17px;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      background: #0d55bd;
    }

    #status {
      margin-top: 20px;
      padding: 12px;
      line-height: 1.6;
    }

    .warning {
      background: #fff4d6;
      border-radius: 10px;
      padding: 12px;
      margin-top: 15px;
      font-size: 14px;
    }

    a {
      color: #1769e0;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>📱 આ ફોન ખોવાયેલો છે</h1>

    <p>
      જો તમને આ ફોન મળ્યો હોય, તો કૃપા કરીને માલિકને ફોન પરત કરવામાં મદદ કરો.
    </p>

    <div class="warning">
      Location શેર કરવી સંપૂર્ણપણે તમારી મંજૂરી પર આધારિત છે.
      "Location Share કરો" દબાવ્યા પછી browser permission માંગશે.
    </div>

    <button id="shareLocation">
      📍 Location Share કરો
    </button>

    <div id="status"></div>

  </div>

  <script>

    const button = document.getElementById("shareLocation");
    const status = document.getElementById("status");

    button.addEventListener("click", function () {

      if (!navigator.geolocation) {

        status.innerHTML =
          "❌ આ browser location sharing support કરતું નથી.";

        return;
      }

      status.innerHTML =
        "⏳ Location permission માંગવામાં આવી રહી છે...";

      navigator.geolocation.getCurrentPosition(

        function(position) {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;

          const accuracy =
            Math.round(position.coords.accuracy);

          const googleMaps =
            "https://www.google.com/maps?q=" +
            latitude + "," + longitude;

          status.innerHTML = `
            <strong>✅ Location મળી ગઈ છે.</strong>
            <br><br>

            Latitude: ${latitude.toFixed(6)}
            <br>

            Longitude: ${longitude.toFixed(6)}
            <br>

            Accuracy: આશરે ${accuracy} મીટર
            <br><br>

            <a href="${googleMaps}" target="_blank">
              🗺️ Google Maps પર Location જુઓ
            </a>
          `;

        },

        function(error) {

          if (error.code === 1) {

            status.innerHTML =
              "❌ Location permission આપવામાં આવી નથી.";

          } else if (error.code === 2) {

            status.innerHTML =
              "❌ Location ઉપલબ્ધ નથી.";

          } else if (error.code === 3) {

            status.innerHTML =
              "❌ Location મેળવવામાં સમય લાગી ગયો.";

          } else {

            status.innerHTML =
              "❌ Location મેળવી શકાઈ નથી.";

          }

        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }

      );

    });

  </script>

</body>
</html>
